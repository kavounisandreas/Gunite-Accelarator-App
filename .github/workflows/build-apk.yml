name: Build GuniteCalc APK from Project ZIP

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build-apk:
    name: Build installable APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Extract Android project
        run: |
          test -f GuniteProject.zip
          mkdir -p project
          unzip -q -o GuniteProject.zip -d project

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 36 SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'
          cache-provider: basic

      - name: Build APK
        working-directory: project
        run: gradle --no-daemon assembleDebug

      - name: Prepare APK
        run: cp project/app/build/outputs/apk/debug/app-debug.apk GuniteCalc.apk

      - name: Upload APK directly
        uses: actions/upload-artifact@v7
        with:
          path: GuniteCalc.apk
          archive: false
          retention-days: 30
          if-no-files-found: error
